apply plugin: 'com.android.application'

def firebaseConfigPresent = file('google-services.json').exists()

android {
    namespace = 'th.ac.vu.classflow'
    compileSdk = 37

    defaultConfig {
        applicationId = 'th.ac.vu.classflow'
        minSdk = 24
        targetSdk = 37
        versionCode = 1
        versionName = '1.0'

        buildConfigField 'boolean', 'FIREBASE_CONFIGURED', firebaseConfigPresent.toString()
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.fragment:fragment:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.firebase:firebase-auth:24.2.0'
    implementation 'com.google.firebase:firebase-firestore:26.6.0'
    testImplementation 'junit:junit:4.13.2'
}

if (firebaseConfigPresent) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.lifecycle('ClassFlow: app/google-services.json is absent; Firebase runtime actions are disabled for this build.')
}
